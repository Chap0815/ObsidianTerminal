name: Bug report
description: Report a reproducible defect without exposing private data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Never include API keys, .env files, tokens, databases or raw runtime folders.
        For vulnerabilities, read SECURITY.md and use a private reporting channel.
        If LIVE exposure is involved, supervise it directly at your exchange.
  - type: input
    id: build
    attributes:
      label: Version or build
      description: Include the commit/build identifier if available.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python version and exchange name; no account identifiers.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Affected mode
      options:
        - Simulation
        - Live
        - Both
        - Installation or UI only
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Identify the strategy, expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Sanitized error excerpt
      description: Only a short relevant excerpt. Remove secrets and private account information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed credentials and private account data.
          required: true
